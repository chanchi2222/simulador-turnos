                                </div>
                            </div>
                            <div className="bg-gradient-to-r from-slate-100 to-white rounded-xl shadow-sm border border-slate-300 p-6"><h3 className="text-xl font-bold text-slate-900 mb-4 border-b pb-2 flex items-center gap-2"><Icon path={Icons.Rotate} className="w-6 h-6 text-blue-600" /> PUNTO DE PARTIDA ({COLLA_NAMES[activeColla]})</h3><div className="grid grid-cols-1 md:grid-cols-3 gap-6"><div><label className="block text-sm font-bold text-gray-700 mb-1">Fecha de Inicio</label><input type="date" className="w-full p-3 border rounded-lg text-lg font-mono" value={tempRefData.dateString} onChange={(e) => setTempRefData({...tempRefData, dateString: e.target.value})} /></div><div><label className="block text-sm font-bold text-gray-700 mb-1">Primer Guardia (Nº 1)</label><select className="w-full p-3 border rounded-lg text-lg font-bold text-slate-700" value={tempRefData.firstGuardName} onChange={(e) => setTempRefData({...tempRefData, firstGuardName: e.target.value})}>{names.map(name => <option key={name} value={name}>{name}</option>)}</select></div><div><label className="block text-sm font-bold text-gray-700 mb-1">Centro ese día</label><div className="flex gap-0 rounded-lg overflow-hidden border border-gray-300 h-[50px]"><button onClick={() => setTempRefData({...tempRefData, center: 'CORTIJOS'})} className={`flex-1 font-bold transition ${tempRefData.center === 'CORTIJOS' ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>CORTIJOS</button><button onClick={() => setTempRefData({...tempRefData, center: 'CEHORPA'})} className={`flex-1 font-bold transition ${tempRefData.center === 'CEHORPA' ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>CEHORPA</button></div></div></div></div>
                            <div className="bg-green-50 rounded-xl shadow-sm border border-green-200 p-6">
                                <h3 className="text-xl font-bold text-green-800 mb-6 border-b border-green-200 pb-2 flex items-center gap-2"><Icon path={Icons.Leaf} className="w-6 h-6" /> LOS VERDES (Personal Especial)</h3>
                                <div className="bg-white p-4 rounded-lg border border-green-100 mb-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div><label className="text-xs font-bold text-gray-500">Nombre</label><input type="text" className="w-full p-2 border rounded uppercase font-bold" value={newVerde.name} onChange={e => setNewVerde({...newVerde, name: e.target.value})} /></div>
                                        <div><label className="text-xs font-bold text-gray-500">Fecha de inicio del periodo</label><input type="date" className="w-full p-2 border rounded" value={newVerde.startDate} onChange={e => setNewVerde({...newVerde, startDate: e.target.value})} /></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div><label className="text-xs font-bold text-gray-500">Patrón Inicial (Esa semana hace...)</label><select className="w-full p-2 border rounded" value={newVerde.startCycleIndex} onChange={e => setNewVerde({...newVerde, startCycleIndex: parseInt(e.target.value)})}><option value="0">Guardia L-J (Madruga X-S)</option><option value="1">Guardia M-V (Madruga L-J)</option><option value="2">Guardia X-S (Madruga M-V)</option></select></div>
                                        <div><label className="text-xs font-bold text-gray-500">Centro inicial</label><select className="w-full p-2 border rounded" value={newVerde.startCenter} onChange={e => setNewVerde({...newVerde, startCenter: e.target.value})}><option value="CORTIJOS">Empieza en CORTIJOS</option><option value="CEHORPA">Empieza en CEHORPA</option></select></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Cambio de centro</label>
                                            <select className="w-full p-2 border rounded" value={newVerde.rotationMode} onChange={e => setNewVerde({...newVerde, rotationMode: e.target.value})}>
                                                <option value="SEMANAL">Cada semana</option>
                                                <option value="DIARIO">Cada día</option>
                                                <option value="FIJO">No cambia de centro</option>
                                                <option value="SEGUN_GRUPO">Sigue al centro del grupo</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Duración</label>
                                            <div className="grid grid-cols-3 gap-1">
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'WEEK'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'WEEK' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>7 días</button>
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'CUSTOM'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'CUSTOM' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Fechas</button>
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'ONGOING'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'ONGOING' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Sin fin</button>
                                            </div>
                                        </div>
                                    </div>
                                    {newVerde.periodMode === 'CUSTOM' && <div><label className="text-xs font-bold text-gray-500">Fecha de fin (incluida)</label><input type="date" min={newVerde.startDate} className="w-full p-2 border rounded" value={newVerde.endDate} onChange={e => setNewVerde({...newVerde, endDate: e.target.value})} /></div>}
                                    {newVerde.periodMode === 'WEEK' && <p className="text-xs text-green-800">Estará activo desde el inicio durante 7 días, ambos extremos incluidos.</p>}
                                    {newVerde.periodMode === 'ONGOING' && <p className="text-xs text-green-800">Estará activo desde la fecha de inicio hasta que lo elimines.</p>}
                                    <button onClick={addVerde} className="mt-4 w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 shadow-sm">AÑADIR VERDE AL PERIODO</button>
                                </div>
                                <div className="space-y-2">
                                    {verdes.map(v => (
                                        <div key={v.id} className="flex justify-between items-center bg-white p-3 rounded border shadow-sm">
                                            <div>
                                                <span className="font-black text-green-900">{v.name}</span>
                                                <div className="text-[10px] text-gray-500 font-mono mt-0.5">
                                                    {v.startDate} – {v.endDate || 'sin fecha de fin'} | {v.rotationMode === 'FIJO' ? 'Centro fijo' : v.rotationMode === 'DIARIO' ? 'Cambia de centro cada día' : v.rotationMode === 'SEGUN_GRUPO' ? 'Sigue al grupo' : 'Cambia de centro cada semana'} | Inicio en {v.startCenter || v.centerMode || 'CEHORPA'}
                                                </div>
                                            </div>
                                            <button onClick={() => removeVerde(v.id)} className="text-red-500 hover:bg-red-50 p-1 rounded"><Icon path={Icons.Trash} className="w-4 h-4" /></button>
                                        </div>
                                    ))}
                                    {verdes.length === 0 && <p className="text-center text-gray-400 italic text-xs">No hay personal verde configurado.</p>}
                                </div>
                            </div>
                            <button onClick={saveSettingsToCloud} className="w-full bg-green-600 text-white py-4 rounded-xl font-bold">GUARDAR CONFIGURACIÓN Y PUNTO DE PARTIDA</button>
                        </div> 
                    </div> )}

                    <main className="max-w-lg mx-auto p-1.5 flex-1 flex flex-col w-full">
                        {names.length === 0
                            ? <p className="m-4 rounded-lg border border-amber-200 bg-amber-50 p-4 text-center text-sm font-semibold text-amber-800">Esta colla no tiene personal configurado. Añade personas desde Configuración.</p>
                            : viewMode === 'daily'
                            ? <DailyView simulation={simulation} />
                            : <WeeklyView weekData={weekData} names={names} verdes={verdes} />
                        }
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
