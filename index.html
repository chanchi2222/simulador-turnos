<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Turnos</title>
    
    <!-- TAILWIND CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- REACT & REACT DOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- BABEL -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SUPABASE JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./simulator-core.js"></script>
    
    <style>
        body { -webkit-tap-highlight-color: transparent; background-color: #f9fafb; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .date-btn-container { position: relative; }
        .date-input-hidden {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; z-index: 20;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;
        const { formatLocalDate, parseLocalDate, getMonday, getInclusivePeriodEndDate, calculateSimulation, validateConfig, validateDataIntegrity, recordDataChange, undoLastDataChange, normalizeConfig } = window.SimulatorCore;

        // ==========================================
        // 1. CONSTANTES, ICONOS Y HELPERS
        // ==========================================
        const PRECONFIGURED_URL = "https://dwccmujoouxzovbhndpx.supabase.co";
        const PRECONFIGURED_KEY = "sb_publishable_x7wvlT-vPhu5p8i5k7Wa-Q_yb3s1slS";
        const COLLA_NAMES = { '1': 'RAYO', '2': 'MIGUEL SEXI' };

        const INITIAL_NAMES_COLLA1 = ["PERSONA 01", "PERSONA 02", "PERSONA 03", "PERSONA 04", "PERSONA 05", "PERSONA 06", "PERSONA 07", "PERSONA 08", "PERSONA 09", "PERSONA 10", "PERSONA 11", "PERSONA 12", "PERSONA 13", "PERSONA 14", "PERSONA 15", "PERSONA 16", "PERSONA 17"];
        const INITIAL_REF_DATA_COLLA1 = { dateString: "2025-12-06", firstGuardName: "PERSONA 01", center: "CORTIJOS" };
        const INITIAL_NAMES_COLLA2 = ["PERSONA 01", "PERSONA 02", "PERSONA 03", "PERSONA 04", "PERSONA 05", "PERSONA 06", "PERSONA 07", "PERSONA 08", "PERSONA 09", "PERSONA 10", "PERSONA 11", "PERSONA 12", "PERSONA 13", "PERSONA 14", "PERSONA 15"];
        const INITIAL_REF_DATA_COLLA2 = { dateString: "2025-12-06", firstGuardName: "PERSONA 01", center: "CEHORPA" };

        const DEFAULT_CONFIG = {
            cehorpa: { guardias: 6, madrugan: 4, horaGuardia: "10:00", horaMadruga: "07:00", horaResto: "09:00" },
            cortijos: { capacidad: 8, guardias: 4, intermedios: 2, madrugan: 2, horaGuardia: "10:00", horaIntermedia: "08:00", horaMadruga: "07:00", horaRestoCehorpa: "09:00" }
        };

        const Icon = ({ path, className }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{path}</svg>
        );
        const Icons = {
            Cal: <><rect width="18" height="18" x="3" y="4" rx="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></>,
            Set: <><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.47a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.35a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></>,
            Search: <><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></>,
            Share: <><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></>,
            Moon: <><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></>,
            Map: <><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></>,
            Coffee: <><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 0 1 4 4v1a4 4 0 0 1-4 4h-1"/><line x1="6" x2="6" y1="2" y2="4"/></>,
            Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            Rotate: <><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></>,
            X: <><path d="M18 6 6 18"/><path d="m6 6 12 12"/></>,
            Plus: <><path d="M5 12h14"/><path d="M12 5v14"/></>,
            Trash: <><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></>,
            Arrow: <><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></>,
            Chart: <><path d="M3 3v18h18"/><path d="M18 17V9"/><path d="M13 17V5"/><path d="M8 17v-3"/></>,
            Swap: <><path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/></>,
            Bandage: <><path d="M14 12a2 2 0 1 0 4 0 2 2 0 0 0-4 0"/><path d="m10.24 3.96 8.8 8.8a3 3 0 0 1 0 4.24l-4.24 4.25a3 3 0 0 1-4.24 0l-8.8-8.8a3 3 0 0 1 0-4.25l4.25-4.24a3 3 0 0 1 4.24 0Z"/><path d="m18 10-8 8"/></>,
            Leaf: <><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></>
        };

        const ConfirmationModal = ({ show, title, message, onConfirm, onCancel, isAlert }) => {
            if (!show) return null;
            return (
                <div className="fixed inset-0 z-[110] flex items-center justify-center bg-black/50 p-4 animate-in fade-in duration-200">
                    <div className="bg-white rounded-xl shadow-xl max-w-sm w-full p-6 relative">
                        <h3 className="text-lg font-bold text-gray-900 mb-2">{title}</h3>
                        <p className="text-gray-600 mb-6 text-sm">{message}</p>
                        <div className="flex justify-end gap-2">
                            {!isAlert && (
                                <button onClick={onCancel} className="px-4 py-2 bg-gray-100 text-gray-700 rounded-lg font-bold text-xs hover:bg-gray-200 transition">
                                    CANCELAR
                                </button>
                            )}
                            <button onClick={onConfirm} className="px-4 py-2 bg-emerald-600 text-white rounded-lg font-bold text-xs hover:bg-emerald-700 transition shadow-sm">
                                {isAlert ? 'ENTENDIDO' : 'CONFIRMAR'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const Header = ({ activeColla, setActiveColla, cloudStatus, cloudError, onCloudRetry, onSettingsClick }) => (
            <>
                <header className="bg-slate-800 text-white py-3 px-4 shadow-md sticky top-0 z-30 flex justify-between items-center shrink-0">
                    <div className="flex items-center gap-2">
                        <div className="bg-white/10 p-1.5 rounded-lg"><Icon path={Icons.Cal} className="w-5 h-5" /></div>
                        <h1 className="font-bold text-base tracking-tight">Simulador</h1>
                    </div>
                    <div className="flex items-center bg-slate-700/50 rounded-lg p-1 border border-slate-600">
                        <button onClick={() => setActiveColla('1')} className={`px-3 py-1 rounded text-[10px] font-bold transition ${activeColla === '1' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-white'}`}>RAYO</button>
                        <button onClick={() => setActiveColla('2')} className={`px-3 py-1 rounded text-[10px] font-bold transition ${activeColla === '2' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400 hover:text-white'}`}>MIGUEL SEXI</button>
                    </div>
                    <div className="flex items-center gap-2">
                        <button
                            type="button"
                            onClick={onCloudRetry}
                            title={cloudError || (cloudStatus === 'connected' ? 'Sincronizado con Supabase' : 'Pulsa para volver a conectar con Supabase')}
                            className={`rounded px-2 py-1 text-[9px] font-bold ${cloudStatus === 'connected' ? 'bg-emerald-700 text-emerald-100' : cloudStatus === 'connecting' ? 'bg-amber-600 text-white' : 'bg-red-700 text-red-100'}`}
                        >
                            {cloudStatus === 'connected' ? 'NUBE' : cloudStatus === 'connecting' ? 'CONECTANDO' : 'SIN CONEXIÓN'}
                        </button>
                        <button onClick={onSettingsClick} className="p-2 rounded-full bg-white/10 hover:bg-white/20 transition relative z-40"><Icon path={Icons.Set} className="w-5 h-5" /></button>
                    </div>
                </header>
                {cloudStatus === 'error' && cloudError && (
                    <div role="alert" className="bg-red-50 border-b border-red-200 px-4 py-2 text-center text-xs text-red-800">
                        {cloudError}
                    </div>
                )}
            </>
        );

        const ControlBar = ({ selectedDate, setSelectedDate, viewMode, setViewMode, onSearch, onStats, onShare, weekData, handlePrev, handleNext, handleToday, isToday }) => (
            <div className="bg-white shadow-sm border-b border-gray-200 p-3 shrink-0 z-10">
                <div className="max-w-lg mx-auto flex flex-col gap-3">
                    <div className="flex items-stretch gap-2">
                        <div className="flex-1 flex items-center justify-between bg-gray-50 rounded-xl p-1 border border-gray-200 relative">
                            <button onClick={handlePrev} className="p-2 rounded-lg hover:bg-white hover:shadow-sm text-slate-500 transition active:scale-95"><Icon path={Icons.Arrow} className="w-4 h-4 rotate-180" /></button>
                            <div className="flex-1 flex flex-col items-center justify-center relative date-btn-container">
                                <div className="flex items-center gap-1.5 bg-white px-2 py-1 rounded-lg border border-gray-100 shadow-sm">
                                    <Icon path={Icons.Cal} className="w-3.5 h-3.5 text-emerald-500 shrink-0" />
                                    <div className="text-sm font-black text-slate-800 leading-none uppercase">
                                            {viewMode === 'weekly' && weekData ? 
                                                `${weekData[0].date.toLocaleDateString('es-ES', {day:'numeric', month:'short'})} - ${weekData[5].date.toLocaleDateString('es-ES', {day:'numeric', month:'short'})}`
                                                : viewMode === 'monthly'
                                                ? selectedDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' })
                                                : selectedDate.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' }).replace('.', '')
                                            }
                                    </div>
                                </div>
                                <input type="date" className="date-input-hidden" value={formatLocalDate(selectedDate)} onChange={(e) => { const date = parseLocalDate(e.target.value); if (date) setSelectedDate(date); }} />
                            </div>
                            <button onClick={handleNext} className="p-2 rounded-lg hover:bg-white hover:shadow-sm text-slate-500 transition active:scale-95"><Icon path={Icons.Arrow} className="w-4 h-4" /></button>
                        </div>
                        <button onClick={handleToday} className={`px-3 rounded-xl font-bold text-white shadow-sm flex items-center justify-center transition active:scale-95 ${isToday ? 'bg-green-300' : 'bg-green-500 hover:bg-green-600'}`} disabled={isToday}>HOY</button>
                    </div>
                    <div className="flex min-w-0 gap-2">
                        <div className="flex bg-gray-100 p-1 rounded-lg shrink-0">
                            <button onClick={() => setViewMode('daily')} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition ${viewMode === 'daily' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>DÍA</button>
                            <button onClick={() => setViewMode('weekly')} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition ${viewMode === 'weekly' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>SEMANA</button>
                            <button onClick={() => setViewMode('monthly')} className={`px-3 py-1.5 rounded-md text-[10px] font-bold transition ${viewMode === 'monthly' ? 'bg-white text-slate-800 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}>MES</button>
                        </div>
                        <div className="w-px bg-gray-200 mx-1"></div>
                        <button onClick={onSearch} aria-label="Buscar turnos" title="Buscar turnos" className="min-w-0 flex-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 border border-emerald-200 rounded-lg flex items-center justify-center gap-0 sm:gap-2 text-[10px] font-bold transition active:scale-95"><Icon path={Icons.Search} className="w-4 h-4 shrink-0" /><span className="hidden sm:inline">BUSCAR</span></button>
                        <button onClick={onStats} aria-label="Estadísticas" title="Estadísticas" className="min-w-0 flex-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 border border-indigo-200 rounded-lg flex items-center justify-center gap-0 sm:gap-2 text-[10px] font-bold transition active:scale-95"><Icon path={Icons.Chart} className="w-4 h-4 shrink-0" /><span className="hidden sm:inline">STATS</span></button>
                        <button onClick={onShare} aria-label="Compartir por WhatsApp" title="Compartir por WhatsApp" className="min-w-0 flex-1 bg-green-500 text-white hover:bg-green-600 rounded-lg flex items-center justify-center gap-0 sm:gap-2 text-[10px] font-bold shadow-sm transition active:scale-95"><Icon path={Icons.Share} className="w-4 h-4 shrink-0" /><span className="hidden sm:inline">WHATSAPP</span></button>
                    </div>
                </div>
            </div>
        );

        const DailyView = ({ simulation }) => {
            if (!simulation) return null;
            if (simulation.isSunday) return (
                <div className="flex flex-col items-center justify-center py-12 bg-white rounded shadow-sm border border-dashed border-gray-300 mt-4">
                    <Icon path={Icons.Coffee} className="w-12 h-12 text-gray-300 mb-2" />
                    <h2 className="text-2xl font-bold text-gray-400">Domingo</h2>
                </div>
            );

            return (
                <div className="space-y-2 mt-2">
                    <div className="grid grid-cols-2 gap-2">
                        <div className={`rounded px-3 py-3 text-white flex justify-between items-center shadow-sm ${simulation.center === 'CORTIJOS' ? 'bg-gradient-to-r from-emerald-600 to-emerald-500' : 'bg-gradient-to-r from-blue-600 to-blue-500'}`}>
                            <div><p className="text-[10px] font-black opacity-80 uppercase">Centro</p><h2 className="text-xl font-bold leading-none">{simulation.center}</h2></div>
                            <Icon path={Icons.Map} className="w-6 h-6 opacity-40" />
                        </div>
                        <div className="rounded px-3 py-3 bg-white border border-red-100 flex justify-between items-center shadow-sm">
                            <div><p className="text-[10px] font-black text-red-400 uppercase">Libra Hoy</p><h2 className="text-xl font-bold text-gray-800 leading-none">{simulation.libra}</h2></div>
                            <Icon path={Icons.Moon} className="w-6 h-6 text-red-200" />
                        </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2 items-start">
                        {simulation.groups.map((group, idx) => (
                            <div key={idx} className="bg-white rounded-lg shadow-sm border border-slate-100 overflow-hidden">
                                <div className={`px-2 py-1.5 text-[10px] font-black uppercase flex justify-between ${group.color}`}>
                                    <span>{group.title}</span><span className="bg-black/20 px-1.5 rounded text-white">{group.items.length}</span>
                                </div>
                                <div className="divide-y divide-slate-100">
                                    {group.items.map((p, i) => (
                                        <div key={i} className={`px-2 py-2 flex flex-col relative ${p.status === 'BAJA' ? 'bg-red-50' : p.status === 'VACACIONES' ? 'bg-green-50' : 'bg-white'}`}>
                                            {p.status === 'BAJA' && <div className="absolute inset-0 flex items-center justify-center text-red-300 font-black opacity-20 text-3xl rotate-[-10deg] pointer-events-none">BAJA</div>}
                                            {p.status === 'VACACIONES' && <div className="absolute inset-0 flex items-center justify-center text-green-300 font-black opacity-20 text-2xl rotate-[-10deg] pointer-events-none">VACACIONES</div>}
                                            <div className="flex items-center gap-2 mb-1">
                                                <span className="bg-slate-200 text-slate-700 text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full">{p.rank || '-'}</span>
                                                <span className={`text-sm font-bold truncate ${p.isVerde ? 'text-green-700' : 'text-slate-800'}`}>{p.name} {p.isVerde && '🌿'}</span>
                                            </div>
                                            <div className="flex justify-between items-center pl-7">
                                                <span className="text-xs font-black px-2 py-0.5 bg-slate-100 rounded border">{p.time}</span>
                                                {p.specialLabel && (
                                                    <div className="absolute right-2 top-2 bg-yellow-100 text-yellow-800 text-[7px] font-black px-1.5 py-0.5 rounded border border-yellow-300 shadow-sm uppercase tracking-tight max-w-[80px] text-right leading-tight">
                                                        {p.specialLabel}
                                                    </div>
                                                )}
                                                <div className="flex gap-1">
                                                    {p.special && <span className="text-[8px] bg-purple-100 text-purple-800 px-1 rounded font-bold border border-purple-200 shadow-sm">PUNTO</span>}
                                                    {p.isFlejador && <span className="text-[8px] bg-indigo-100 text-indigo-800 px-1 rounded font-bold border border-indigo-200 shadow-sm">FLEJA</span>}
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ))}
                    </div>
                </div>
            );
        };

        const WeeklyView = ({ weekData, names, verdes }) => {
            const getCellClass = (info) => {
                if(!info) return '';
                if(info.status === 'LIBRE') return 'bg-gray-300 text-gray-800 font-bold'; 
                if(info.status === 'BAJA') return 'bg-red-600 text-white font-bold border-r border-red-700'; 
                if(info.status === 'VACACIONES') return 'bg-green-600 text-white font-bold border-r border-green-700'; 
                if(info.role && info.role.includes('GUARDIA')) return 'bg-emerald-600 text-white font-bold border-r border-emerald-700';
                if(info.role && info.role.includes('MADRUGA')) return 'bg-orange-500 text-white font-bold border-r border-orange-600';
                if(info.role && info.role.includes('INTERMEDIO')) return 'bg-yellow-500 text-black font-bold border-r border-yellow-600';
                return 'bg-blue-600 text-white font-bold border-r border-blue-700'; 
            };

            const getCellContent = (info) => {
                if(!info) return '';
                if(info.status === 'LIBRE') return <span className="text-[10px]">LIBRE</span>;
                if(info.status === 'BAJA') return <span className="text-[10px] block">BAJA</span>;
                if(info.status === 'VACACIONES') return <span className="text-[10px] block">VACAS</span>;
                return (
                    <div className="flex flex-col items-center justify-center h-full">
                        <span className="text-xs font-black leading-none">{info.display}</span>
                        {info.specialLabel && <span className="text-[6px] uppercase tracking-tighter leading-none mt-0.5">{info.specialLabel.split(' ')[0]}</span>}
                        <div className="flex gap-0.5 mt-0.5">
                            {info.isFlejador && <span className="text-[8px] bg-black/30 px-1 rounded font-bold">F</span>}
                            {info.special && <span className="text-[8px] bg-black/30 px-1 rounded font-bold">P</span>}
                        </div>
                    </div>
                );
            };

            if (!weekData) return null;

            return (
                <div className="flex-1 bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden flex flex-col max-h-[75vh] mt-2">
                    <div className="overflow-auto flex-1 scrollbar-hide">
                        <table className="w-full text-left border-collapse">
                            <thead className="bg-slate-100 sticky top-0 z-10 shadow-sm">
                                <tr>
                                    <th className="p-2 text-[10px] font-black text-slate-600 uppercase border-b border-r bg-slate-100 sticky left-0 z-20 min-w-[80px] shadow-md">Nombre</th>
                                    {weekData.map((d, i) => (
                                        <th key={i} className="p-2 text-center border-b min-w-[70px] bg-gray-50">
                                            <div className="flex flex-col items-center"><span className="text-[9px] font-bold text-slate-500">{d.shortName} <span className="text-slate-900 text-[11px]">{d.date.getDate()}</span></span><span className={`text-[8px] font-black px-1.5 rounded-full ${d.center==='CORTIJOS'?'bg-emerald-100 text-emerald-700':'bg-blue-100 text-blue-700'}`}>{d.center==='CORTIJOS'?'COR':'CEH'}</span></div>
                                        </th>
                                    ))}
                                    <th className="p-2 text-center border-b bg-gray-100 min-w-[30px] text-[9px] font-bold text-slate-500">T</th>
                                </tr>
                            </thead>
                            <tbody className="divide-y divide-gray-100">
                                {verdes.length > 0 && <tr className="bg-green-50"><td colSpan={8} className="p-1 text-xs font-bold text-green-800 text-center border-b border-green-100">🌿 LOS VERDES</td></tr>}
                                {names.map((name, idx) => {
                                    const daysWorked = weekData.filter(d => d.data[name]?.status === 'WORK').length;
                                    return (
                                    <tr key={name} className={idx%2===0?'bg-white':'bg-slate-50'}>
                                        <td className="p-2 text-[10px] font-bold text-slate-800 border-r sticky left-0 z-10 bg-inherit shadow-md truncate max-w-[90px]">{name}</td>
                                        {weekData.map((d, i) => {
                                            const info = d.data[name];
                                            return <td key={i} className={`p-1 text-center border-r border-slate-100 ${getCellClass(info)}`}>{getCellContent(info)}</td>;
                                        })}

        const MonthlyView = ({ monthData, selectedDate, onSelectDate }) => {

        const App = () => {
            const [selectedDate, setSelectedDate] = useState(new Date());
            const [activeColla, setActiveColla] = useState('1'); 
            const [globalConfig, setGlobalConfig] = useState(DEFAULT_CONFIG);
            const [supabaseClient, setSupabaseClient] = useState(null);
            const [cloudStatus, setCloudStatus] = useState('connecting');
            const [cloudError, setCloudError] = useState('');
            const connectionAttemptRef = React.useRef(false);
            const localChangesPendingRef = React.useRef(localStorage.getItem('turnos_pending_sync_v1') === 'true');
            const saveQueueRef = React.useRef(Promise.resolve());
            const saveEpochRef = React.useRef(0);
            const latestLocalDraftRef = React.useRef(null);
            const importBackupInputRef = React.useRef(null);
            const currentDataRef = React.useRef(null);
            const changeHistoryRef = React.useRef([]);
            const undoStackRef = React.useRef([]);
            const cloudRevisionRef = React.useRef(localStorage.getItem('turnos_remote_revision_v1') || '');
            const [changeHistory, setChangeHistory] = useState([]);
            const [undoStack, setUndoStack] = useState([]);
            const [importPreview, setImportPreview] = useState(null);
            const [conflictBackupAvailable, setConflictBackupAvailable] = useState(Boolean(localStorage.getItem('turnos_conflict_backup_v1')));
            const setLocalChangesPending = pending => {
                localChangesPendingRef.current = pending;
                try {
                    if (pending) localStorage.setItem('turnos_pending_sync_v1', 'true');
                    else localStorage.removeItem('turnos_pending_sync_v1');
                    if (pending) localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                } catch (error) {
                    console.error('No se pudo guardar el estado de sincronización local.', error);
                }
            };
            const [collasData, setCollasData] = useState({
                '1': { names: INITIAL_NAMES_COLLA1, verdes: [], refData: INITIAL_REF_DATA_COLLA1, absences: [] },
                '2': { names: INITIAL_NAMES_COLLA2, verdes: [], refData: INITIAL_REF_DATA_COLLA2, absences: [] }
            });

            // MODAL STATE
            const [modalConfig, setModalConfig] = useState({ show: false, title: '', message: '', onConfirm: null, isAlert: false });

            const activeCollaData = collasData[activeColla] || { names: [], verdes: [], refData: {}, absences: [] };
            const names = Array.isArray(activeCollaData.names) ? activeCollaData.names : (activeColla === '1' ? INITIAL_NAMES_COLLA1 : INITIAL_NAMES_COLLA2);
            const verdes = activeCollaData.verdes || [];
            const refData = (activeCollaData.refData && activeCollaData.refData.dateString) ? activeCollaData.refData : (activeColla === '1' ? INITIAL_REF_DATA_COLLA1 : INITIAL_REF_DATA_COLLA2);
            const absences = activeCollaData.absences || []; 
            const activeAbsencesList = absences.map(a => ({ ...a, status: a.type })).sort((a,b) => a.start.localeCompare(b.start));

            const [viewMode, setViewMode] = useState('daily');
            const [showSettings, setShowSettings] = useState(false);
            const [showSearch, setShowSearch] = useState(false);
            const [showStats, setShowStats] = useState(false);
            const [configTab, setConfigTab] = useState('Personal');
            const [simulation, setSimulation] = useState(null);
            const [monthlyStats, setMonthlyStats] = useState(null);
            
            const [searchType, setSearchType] = useState('person');
            const [searchPerson, setSearchPerson] = useState("");
            const [searchDateQuery, setSearchDateQuery] = useState(formatLocalDate(new Date()));
            const [searchStartDate, setSearchStartDate] = useState(formatLocalDate(new Date()));
            const [searchEndDate, setSearchEndDate] = useState(formatLocalDate(new Date()));
            const [searchRange, setSearchRange] = useState(7);
            const [searchResults, setSearchResults] = useState(null);

            const [newName, setNewName] = useState("");
            const [newPosition, setNewPosition] = useState(""); 
            
            const [newVerde, setNewVerde] = useState({ 
                name: "", 
                startDate: formatLocalDate(new Date()),
                startCycleIndex: 0,
                startCenter: "CORTIJOS",
                rotationMode: "SEMANAL", 
                endDate: "",
                periodMode: "WEEK"
            });

            const [transferName, setTransferName] = useState("");
            const [transferPos, setTransferPos] = useState(1);
            const [absenceForm, setAbsenceForm] = useState({ name: '', type: 'BAJA', start: formatLocalDate(new Date()), end: '', shiftsRotation: true });
            const [tempConfig, setTempConfig] = useState(null);
            const [tempRefData, setTempRefData] = useState(null);
            const [transferSource, setTransferSource] = useState('1');

            const dataAlerts = useMemo(() => {
                const alertCollasData = showSettings && tempRefData
                    ? { ...collasData, [activeColla]: { ...collasData[activeColla], refData: tempRefData } }
                    : collasData;
                const alertConfig = showSettings && tempConfig ? tempConfig : globalConfig;
                return validateDataIntegrity(alertCollasData, alertConfig, { collaNames: COLLA_NAMES });
            }, [collasData, globalConfig, showSettings, tempConfig, tempRefData, activeColla]);
            const criticalAlerts = dataAlerts.filter(alert => alert.severity === 'error');
            const warningAlerts = dataAlerts.filter(alert => alert.severity === 'warning');
            const alertSummary = [
                criticalAlerts.length ? `${criticalAlerts.length} ${criticalAlerts.length === 1 ? 'error' : 'errores'}` : '',
                warningAlerts.length ? `${warningAlerts.length} ${warningAlerts.length === 1 ? 'aviso' : 'avisos'}` : ''
            ].filter(Boolean).join(' · ') || 'OK';

            const showMessage = (title, message) => setModalConfig({
                show: true,
                title,
                message,
                isAlert: true,
                onConfirm: () => setModalConfig(prev => ({ ...prev, show: false }))
            });

            const applyHistoryMetadata = content => {
                const history = Array.isArray(content && content.changeHistory) ? content.changeHistory : [];
                const stack = Array.isArray(content && content.undoStack) ? content.undoStack : [];
                changeHistoryRef.current = history;
                undoStackRef.current = stack;
                setChangeHistory(history);
                setUndoStack(stack);
            };

            useEffect(() => {
                try {
                    const savedLocal = localStorage.getItem('turnos_data_offline_v1');
                    if (!savedLocal) return;
                    const parsed = JSON.parse(savedLocal);
                    if (parsed.collas) sanitizeAndSetCollas(parsed.collas);
                    if (parsed.config) {
                        const normalized = normalizeConfig(parsed.config, DEFAULT_CONFIG);
                        setGlobalConfig(normalized.config);
                        if (normalized.errors.length) showMessage('Configuración inválida', 'Se han detectado valores no válidos en los datos locales. Se cargarán los valores predeterminados.');
                        else if (normalized.adjustedIntermedios) showMessage('Configuración ajustada', 'Se ha actualizado el número de intermedios para completar la capacidad de Cortijos.');
                    }
                    currentDataRef.current = { collas: sanitizeCollas(parsed.collas), config: parsed.config || DEFAULT_CONFIG };
                    applyHistoryMetadata(parsed);
                } catch (error) {
                    showMessage('Error al cargar datos locales', 'No se pudieron leer los datos guardados en este navegador.');
                }
            }, []);

            const connectToSupabase = async () => {
                if (connectionAttemptRef.current) return;
                connectionAttemptRef.current = true;
                setCloudStatus('connecting');
                setCloudError('');
                try {
                    if (!window.supabase) throw new Error('No se pudo cargar la librería de Supabase.');
                    const client = window.supabase.createClient(PRECONFIGURED_URL, PRECONFIGURED_KEY);
                    const { data, error } = await client
                        .from('shift_data')
                        .select('content')
                        .eq('id', 'main_config')
                        .maybeSingle();
                    if (error) throw error;

                    const savedLocal = localStorage.getItem('turnos_data_offline_v1');
                    if (localChangesPendingRef.current && savedLocal) {
                        const parsed = JSON.parse(savedLocal);
                        const remoteRevision = data && data.content ? data.content.revision || '' : '';
                        const savedBaseRevision = localStorage.getItem('turnos_remote_revision_v1') || '';
                        if (data && data.content && remoteRevision !== savedBaseRevision) {
                            localStorage.setItem('turnos_conflict_backup_v1', savedLocal);
                            setConflictBackupAvailable(true);
                            const content = data.content;
                            if (content.collas) sanitizeAndSetCollas(content.collas);
                            if (content.config) {
                                const normalized = normalizeConfig(content.config, DEFAULT_CONFIG);
                                setGlobalConfig(normalized.config);
                            }
                            currentDataRef.current = { collas: sanitizeCollas(content.collas), config: content.config || DEFAULT_CONFIG };
                            applyHistoryMetadata(content);
                            cloudRevisionRef.current = remoteRevision;
                            localStorage.setItem('turnos_remote_revision_v1', remoteRevision);
                            localStorage.setItem('turnos_data_offline_v1', JSON.stringify(content));
                            setLocalChangesPending(false);
                            showMessage('Cambios simultáneos detectados', 'Otra persona guardó cambios mientras este dispositivo estaba sin conexión. Se ha cargado la versión de Supabase y se conservaron los cambios de este dispositivo en la copia local recuperable.');
                        } else {
                            if (data && data.content) {
                                let syncQuery = client
                                    .from('shift_data')
                                    .update({ content: parsed })
                                    .eq('id', 'main_config');
                                syncQuery = savedBaseRevision
                                    ? syncQuery.filter('content->>revision', 'eq', savedBaseRevision)
                                    : syncQuery.is('content->>revision', null);
                                const { data: synced, error: saveError } = await syncQuery.select('id').maybeSingle();
                                if (saveError) throw saveError;
                                if (!synced) throw new Error('Otra persona modificó los datos durante la sincronización. No se sobrescribieron sus cambios; vuelve a conectar para resolver el conflicto.');
                            } else {
                                const { error: saveError } = await client
                                    .from('shift_data')
                                    .upsert({ id: 'main_config', content: parsed });
                                if (saveError) throw saveError;
                            }
                            if (parsed.collas) sanitizeAndSetCollas(parsed.collas);
                            if (parsed.config) {
                                const normalized = normalizeConfig(parsed.config, DEFAULT_CONFIG);
                                setGlobalConfig(normalized.config);
                            }
                            currentDataRef.current = { collas: sanitizeCollas(parsed.collas), config: parsed.config || DEFAULT_CONFIG };
                            cloudRevisionRef.current = parsed.revision || remoteRevision;
                            localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                            applyHistoryMetadata(parsed);
                            setLocalChangesPending(false);
                        }
                    } else if (data && data.content) {
                        const content = data.content;
                        if (content.collas) sanitizeAndSetCollas(content.collas);
                        if (content.config) {
                            const normalized = normalizeConfig(content.config, DEFAULT_CONFIG);
                            setGlobalConfig(normalized.config);
                            if (normalized.errors.length) showMessage('Configuración inválida', 'La configuración recibida de Supabase no es válida; se cargaron los valores predeterminados.');
                            else if (normalized.adjustedIntermedios) showMessage('Configuración ajustada', 'Se ajustó el número de intermedios para completar la capacidad de Cortijos.');
                        }
                        currentDataRef.current = { collas: sanitizeCollas(content.collas), config: content.config || DEFAULT_CONFIG };
                        cloudRevisionRef.current = content.revision || '';
                        localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                        applyHistoryMetadata(content);
                        localStorage.setItem('turnos_data_offline_v1', JSON.stringify(content));
                    } else if (savedLocal) {
                        const parsed = JSON.parse(savedLocal);
                        const { error: saveError } = await client
                            .from('shift_data')
                            .upsert({ id: 'main_config', content: parsed });
                        if (saveError) throw saveError;
                        if (parsed.collas) sanitizeAndSetCollas(parsed.collas);
                        if (parsed.config) {
                            const normalized = normalizeConfig(parsed.config, DEFAULT_CONFIG);
                            setGlobalConfig(normalized.config);
                        }
                        currentDataRef.current = { collas: sanitizeCollas(parsed.collas), config: parsed.config || DEFAULT_CONFIG };
                        cloudRevisionRef.current = parsed.revision || '';
                        localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                        applyHistoryMetadata(parsed);
                        setLocalChangesPending(false);
                    } else {
                        currentDataRef.current = {
                            collas: sanitizeCollas(collasData),
                            config: globalConfig
                        };
                        cloudRevisionRef.current = '';
                    }

                    setSupabaseClient(client);
                    setCloudStatus('connected');
                } catch (error) {
                    setSupabaseClient(null);
                    setCloudStatus('error');
                    const reason = error && error.message ? ` Detalle: ${error.message}` : '';
                    const message = `No se pudo conectar con Supabase. Revisa las políticas anon de shift_data. Puedes reintentar pulsando el indicador de nube.${reason}`;
                    setCloudError(message);
                    showMessage('Supabase no conectado', `La aplicación seguirá guardando en este navegador. ${message}`);
                } finally {
                    connectionAttemptRef.current = false;
                }
            };

            useEffect(() => {
                connectToSupabase();
            }, []);

            const sanitizeCollas = (loadedCollas) => {
                const safeCollas = {
                    '1': { names: INITIAL_NAMES_COLLA1, verdes: [], refData: INITIAL_REF_DATA_COLLA1, absences: [] },
                    '2': { names: INITIAL_NAMES_COLLA2, verdes: [], refData: INITIAL_REF_DATA_COLLA2, absences: [] }
                };
                ['1', '2'].forEach(key => {
                    const loaded = loadedCollas && loadedCollas[key];
                    if (loaded) {
                        safeCollas[key] = {
                            names: Array.isArray(loaded.names) ? loaded.names : safeCollas[key].names,
                            verdes: Array.isArray(loaded.verdes) ? loaded.verdes : [],
                            refData: loaded.refData || safeCollas[key].refData,
                            absences: Array.isArray(loaded.absences) ? loaded.absences : []
                        };
                    }
                });
                return safeCollas;
            };

            const sanitizeAndSetCollas = (loadedCollas) => {
                setCollasData(sanitizeCollas(loadedCollas));
            };

            const applyRemoteContent = content => {
                const remoteCollas = sanitizeCollas(content.collas);
                const normalized = normalizeConfig(content.config, DEFAULT_CONFIG);
                currentDataRef.current = { collas: remoteCollas, config: normalized.config };
                cloudRevisionRef.current = content.revision || '';
                setCollasData(remoteCollas);
                setGlobalConfig(normalized.config);
                applyHistoryMetadata(content);
                setLocalChangesPending(false);
                try {
                    localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                    localStorage.setItem('turnos_data_offline_v1', JSON.stringify(content));
                } catch (error) {
                    console.error('No se pudo actualizar la copia local con los datos remotos.', error);
                    showMessage('Datos cargados con una advertencia', 'Se cargaron los datos actuales de Supabase, pero no se pudo actualizar la copia local de este dispositivo.');
                }
            };

            const saveAllData = async (nextCollasData = collasData, nextConfig = globalConfig) => {
                const finalCollas = {
                    '1': { ...nextCollasData['1'], names: Array.isArray(nextCollasData['1'].names) ? nextCollasData['1'].names : INITIAL_NAMES_COLLA1 },
                    '2': { ...nextCollasData['2'], names: Array.isArray(nextCollasData['2'].names) ? nextCollasData['2'].names : INITIAL_NAMES_COLLA2 }
                };
                const previousData = currentDataRef.current || { collas: collasData, config: globalConfig };
                const dataToSave = recordDataChange(
                    { ...previousData, changeHistory: changeHistoryRef.current, undoStack: undoStackRef.current },
                    { collas: finalCollas, config: nextConfig },
                    { collaNames: COLLA_NAMES }
                );
                latestLocalDraftRef.current = dataToSave;
                currentDataRef.current = { collas: finalCollas, config: nextConfig };
                applyHistoryMetadata(dataToSave);
                setCollasData(finalCollas);
                setGlobalConfig(nextConfig);
                try {
                    localStorage.setItem('turnos_data_offline_v1', JSON.stringify(dataToSave));
                } catch (error) {
                    showMessage('Error al guardar', 'No se pudieron guardar los cambios en este navegador. Comprueba el espacio disponible y los permisos del navegador.');
                    return false;
                }

                if (!supabaseClient || cloudStatus !== 'connected') {
                    setLocalChangesPending(true);
                    showMessage('Guardado solo en este dispositivo', 'Supabase no está conectado; el cambio se guardó localmente, pero todavía no se ha sincronizado con la nube.');
                    return true;
                }

                const saveEpoch = saveEpochRef.current;
                const saveOperation = saveQueueRef.current.then(async () => {
                    if (saveEpoch !== saveEpochRef.current) return false;
                    const { data: latest, error: readError } = await supabaseClient
                        .from('shift_data')
                        .select('content')
                        .eq('id', 'main_config')
                        .maybeSingle();
                    if (readError) throw readError;
                    const remoteContent = latest && latest.content;
                    if (remoteContent && (remoteContent.revision || '') !== cloudRevisionRef.current) {
                        saveEpochRef.current += 1;
                        const conflictDraft = latestLocalDraftRef.current || dataToSave;
                        try {
                            localStorage.setItem('turnos_conflict_backup_v1', JSON.stringify(conflictDraft));
                            setConflictBackupAvailable(true);
                        } catch (storageError) {
                            showMessage('No se pudo conservar el borrador', 'Se detectaron cambios recientes en Supabase, pero el navegador no pudo guardar una copia local de tus cambios. No se sobrescribió la nube.');
                            applyRemoteContent(remoteContent);
                            return false;
                        }
                        applyRemoteContent(remoteContent);
                        showMessage('Cambios simultáneos detectados', 'Otra persona guardó cambios mientras editabas. No se sobrescribió la nube: se cargó la versión más reciente y tu borrador quedó guardado en Configuración → Copias.');
                        return false;
                    }

                    let writeQuery;
                    if (!remoteContent) {
                        const { error } = await supabaseClient
                            .from('shift_data')
                            .upsert({ id: 'main_config', content: dataToSave });
                        if (error) throw error;
                    } else {
                        writeQuery = supabaseClient
                            .from('shift_data')
                            .update({ content: dataToSave })
                            .eq('id', 'main_config');
                        writeQuery = cloudRevisionRef.current
                            ? writeQuery.filter('content->>revision', 'eq', cloudRevisionRef.current)
                            : writeQuery.is('content->>revision', null);
                        const { data: updated, error } = await writeQuery.select('id').maybeSingle();
                        if (error) throw error;
                        if (!updated) {
                            saveEpochRef.current += 1;
                            const conflictDraft = latestLocalDraftRef.current || dataToSave;
                            const { data: latestAfterRace, error: latestError } = await supabaseClient
                                .from('shift_data')
                                .select('content')
                                .eq('id', 'main_config')
                                .maybeSingle();
                            if (latestError) throw latestError;
                            if (latestAfterRace && latestAfterRace.content) {
                                try {
                                    localStorage.setItem('turnos_conflict_backup_v1', JSON.stringify(conflictDraft));
                                    setConflictBackupAvailable(true);
                                } catch (storageError) {
                                    console.error('No se pudo conservar el borrador tras una colisión remota.', storageError);
                                }
                                applyRemoteContent(latestAfterRace.content);
                            }
                            showMessage('Cambios recientes detectados', 'Otra persona guardó cambios justo antes que tú. No se sobrescribió la nube; revisa la versión actual y recupera tu borrador desde Configuración → Copias.');
                            return false;
                        }
                    }
                    cloudRevisionRef.current = dataToSave.revision || '';
                    localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                    if (latestLocalDraftRef.current === dataToSave) latestLocalDraftRef.current = null;
                    setLocalChangesPending(false);
                    return true;
                }).catch(error => {
                    setLocalChangesPending(true);
                    setCloudStatus('error');
                    const reason = error && error.message ? ` Detalle: ${error.message}` : '';
                    const message = `El cambio se conservó en este navegador, pero no llegó a la nube. Pulsa el indicador de nube para reintentar.${reason}`;
                    setCloudError(message);
                    showMessage('Error al guardar en Supabase', message);
                    return false;
                });
                saveQueueRef.current = saveOperation.then(() => undefined);
                return saveOperation;
            };

            const undoChange = async expectedChangeId => {
                if (!supabaseClient || cloudStatus !== 'connected') {
                    showMessage('Se necesita conexión', 'Conecta con Supabase para deshacer con seguridad y comprobar que nadie haya guardado cambios después.');
                    return;
                }
                try {
                    const { data, error } = await supabaseClient
                        .from('shift_data')
                        .select('content')
                        .eq('id', 'main_config')
                        .maybeSingle();
                    if (error) throw error;
                    if (!data || !data.content || !data.content.revision) {
                        showMessage('No se puede comprobar el historial', 'No se encontró una revisión compartida. No se deshizo ningún cambio.');
                        return;
                    }

                    const result = undoLastDataChange(data.content, expectedChangeId);
                    if (!result.ok) {
                        showMessage('No se deshizo el cambio', result.reason);
                        return;
                    }

                    const { data: updated, error: updateError } = await supabaseClient
                        .from('shift_data')
                        .update({ content: result.content })
                        .eq('id', 'main_config')
                        .filter('content->>revision', 'eq', data.content.revision)
                        .select('id')
                        .maybeSingle();
                    if (updateError) throw updateError;
                    if (!updated) {
                        showMessage('Cambios recientes detectados', 'Otra persona guardó cambios durante la operación. No se deshizo nada; vuelve a cargar la página y revisa el historial.');
                        return;
                    }

                    const restoredCollas = sanitizeCollas(result.content.collas);
                    const normalized = normalizeConfig(result.content.config, DEFAULT_CONFIG);
                    currentDataRef.current = { collas: restoredCollas, config: normalized.config };
                    cloudRevisionRef.current = result.content.revision || '';
                    applyHistoryMetadata(result.content);
                    setCollasData(restoredCollas);
                    setGlobalConfig(normalized.config);
                    try {
                        localStorage.setItem('turnos_data_offline_v1', JSON.stringify(result.content));
                        localStorage.setItem('turnos_remote_revision_v1', cloudRevisionRef.current);
                        setLocalChangesPending(false);
                    } catch (storageError) {
                        console.error('El deshacer se sincronizó, pero no se pudo actualizar la copia local.', storageError);
                        showMessage('Deshecho en la nube', 'El cambio se deshizo en Supabase, pero no se pudo actualizar la copia de este dispositivo.');
                        return;
                    }
                    showMessage('Cambio deshecho', 'Se restauró la versión anterior. El deshacer también aparece en el historial.');
                } catch (error) {
                    const reason = error && error.message ? ` Detalle: ${error.message}` : '';
                    showMessage('No se pudo deshacer', `No se modificó el estado compartido. Comprueba la conexión e inténtalo de nuevo.${reason}`);
                }
            };

            const requestUndoLastChange = () => {
                const latestChange = undoStackRef.current[undoStackRef.current.length - 1];
                if (!latestChange) {
                    showMessage('No hay cambios que deshacer', 'Cuando se guarde una modificación, aparecerá aquí la opción para restaurarla.');
                    return;
                }
                if (!supabaseClient || cloudStatus !== 'connected') {
                    showMessage('Se necesita conexión', 'Conecta con Supabase para deshacer con seguridad y comprobar que nadie haya guardado cambios después.');
                    return;
                }
                setModalConfig({
                    show: true,
                    title: 'Deshacer último cambio',
                    message: `Se restaurará el estado anterior a este cambio: ${latestChange.summary}. Si alguien ya guardó otro cambio, la app cancelará la operación para protegerlo.`,
                    isAlert: false,
                    onConfirm: async () => {
                        setModalConfig(prev => ({ ...prev, show: false }));
                        await undoChange(latestChange.id);
                    }
                });
            };

            const updateActiveCollaData = (updates) => {
                const newCollas = { ...collasData, [activeColla]: { ...collasData[activeColla], ...updates } };
                return saveAllData(newCollas, globalConfig);

            const handleExportBackup = () => {
                const backup = {
                    version: 1,
                    exportedAt: new Date().toISOString(),
                    collas: collasData,
                    config: globalConfig
                };
                downloadJson(backup, `simulador-turnos-backup-${formatLocalDate(new Date())}.json`);
            };

            const downloadJson = (value, filename) => {
                const blob = new Blob([JSON.stringify(value, null, 2)], { type: 'application/json' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = url;
                link.download = filename;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            const handleImportBackup = (event) => {
                const file = event.target.files && event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = async () => {
                    try {
                        const parsed = JSON.parse(reader.result);
                        const content = parsed && parsed.collas ? parsed : parsed && parsed.content;
                        if (!content || !content.collas || !content.config) {
                            throw new Error('El archivo no tiene el formato esperado.');
                        }
                        const missingData = ['1', '2'].flatMap(collaId => {
                            const colla = content.collas[collaId];
                            const label = COLLA_NAMES[collaId];
                            if (!colla || typeof colla !== 'object') return [`Falta la colla ${label}.`];
                            const errors = [];
                            if (!Array.isArray(colla.names)) errors.push(`${label}: falta la lista de personal.`);
                            if (!Array.isArray(colla.verdes)) errors.push(`${label}: faltan los datos de verdes.`);
                            if (!Array.isArray(colla.absences)) errors.push(`${label}: faltan los datos de ausencias.`);
                            if (!colla.refData || typeof colla.refData !== 'object') {
                                errors.push(`${label}: falta el punto de partida.`);
                            } else {
                                if (!parseLocalDate(colla.refData.dateString)) errors.push(`${label}: la fecha del punto de partida no es válida.`);
                                if (!['CORTIJOS', 'CEHORPA'].includes(colla.refData.center)) errors.push(`${label}: falta un centro inicial válido.`);
                                if (colla.names && colla.names.length && !colla.names.includes(colla.refData.firstGuardName)) {
                                    errors.push(`${label}: el primer guardia no está en la lista de personal.`);
                                }
                            }
                            return errors;
                        });
                        if (missingData.length) {
                            throw new Error(missingData.join(' '));
                        }
                        const normalized = normalizeConfig(content.config, DEFAULT_CONFIG);
                        if (normalized.errors.length) {
                            return showMessage('Copia no válida', normalized.errors.join(' '));
                        }
                        const safeCollas = sanitizeCollas(content.collas);
                        const integrityErrors = validateDataIntegrity(safeCollas, normalized.config, { collaNames: COLLA_NAMES })
                            .filter(problem => problem.severity === 'error');
                        if (integrityErrors.length) {
                            throw new Error(integrityErrors.map(problem => `${problem.scope}: ${problem.message}`).join(' '));
                        }
                        const counts = ['1', '2'].map(collaId => ({
                            name: COLLA_NAMES[collaId],
                            people: safeCollas[collaId].names.length,
                            verdes: safeCollas[collaId].verdes.length,
                            absences: safeCollas[collaId].absences.length
                        }));
                        setImportPreview({
                            name: file.name,
                            collas: safeCollas,
                            config: normalized.config,
                            adjustedIntermedios: normalized.adjustedIntermedios,
                            counts
                        });
                    } catch (error) {
                        const reason = error && error.message ? ` ${error.message}` : '';
                        showMessage('No se pudo importar', `Selecciona una copia JSON válida.${reason}`);
                    } finally {
                        event.target.value = '';
                    }
                };
                reader.onerror = () => {
                    showMessage('No se pudo leer', 'El navegador no pudo leer el archivo seleccionado.');
                    event.target.value = '';
                };
                reader.readAsText(file);
            };

            const handleAddName = async (e) => {

                const currentRefData = collasData[activeColla].refData || (activeColla === '1' ? INITIAL_REF_DATA_COLLA1 : INITIAL_REF_DATA_COLLA2);

            const handleRemoveName = (idx) => { 
                setModalConfig({

                    message: `¿Seguro que quieres eliminar a ${names[idx]}?`,

                        await updateActiveCollaData({

                        });

            const addVerde = async (e) => {
                e.preventDefault();
                const name = newVerde.name.trim().toLocaleUpperCase('es-ES');
                const startDate = parseLocalDate(newVerde.startDate);
                if (!name || !startDate) return showMessage('Datos no válidos', 'Escribe el nombre y una fecha de inicio válida para el personal especial.');
                if (!['WEEK', 'CUSTOM', 'ONGOING'].includes(newVerde.periodMode)) {
                    return showMessage('Duración no válida', 'Selecciona una duración válida para el periodo del personal especial.');
                }
                let endDateValue = '';
                if (newVerde.periodMode === 'WEEK') {
                    endDateValue = getInclusivePeriodEndDate(newVerde.startDate, 7);
                    if (!endDateValue) return showMessage('Periodo no válido', 'No se pudo calcular el final de la semana seleccionada.');
                } else if (newVerde.periodMode === 'CUSTOM') {
                    const endDate = parseLocalDate(newVerde.endDate);
                    if (!endDate) return showMessage('Fecha no válida', 'Selecciona una fecha final válida para el periodo.');
                    endDateValue = formatLocalDate(endDate);
                }
                const endDate = endDateValue ? parseLocalDate(endDateValue) : null;
                if (endDateValue && !endDate) {
                    return showMessage('Fecha no válida', 'No se pudo validar el final del periodo seleccionado.');
                }
                if (endDate && endDate < startDate) return showMessage('Rango no válido', 'La fecha final no puede ser anterior a la fecha de inicio.');
                if (![0, 1, 2].includes(Number(newVerde.startCycleIndex))) return showMessage('Patrón no válido', 'Selecciona un patrón de rotación inicial válido.');
                if (!['CORTIJOS', 'CEHORPA'].includes(newVerde.startCenter) || !['SEMANAL', 'DIARIO', 'FIJO', 'SEGUN_GRUPO'].includes(newVerde.rotationMode)) {
                    return showMessage('Configuración no válida', 'El centro o el tipo de rotación seleccionado no es válido.');
                }
                const existingNames = [...names, ...verdes.map(person => person.name)];
                if (existingNames.some(personName => personName.toLocaleUpperCase('es-ES') === name)) {
                    return showMessage('Nombre duplicado', 'Esa persona ya está registrada en esta colla.');
                }
                const updatedVerdes = [...verdes, {
                    name,
                    startDate: newVerde.startDate,
                    endDate: endDateValue,
                    startCycleIndex: Number(newVerde.startCycleIndex),
                    startCenter: newVerde.startCenter,
                    rotationMode: newVerde.rotationMode,
                    id: Date.now()
                }];
                const saved = await updateActiveCollaData({ verdes: updatedVerdes });
                if (!saved) return;
                setNewVerde({
                    name: "",
                    startDate: formatLocalDate(new Date()),
                    startCycleIndex: 0,
                    startCenter: "CORTIJOS",
                    rotationMode: "SEMANAL",
                    endDate: "",
                    periodMode: "WEEK"
                });

            const removeVerde = (id) => { 
                setModalConfig({
                    show: true, title: 'Eliminar Verde', message: '¿Eliminar a este personal especial?', isAlert: false,
                    onConfirm: async () => {
                        const removedVerde = verdes.find(v => v.id === id);

                        setModalConfig(prev => ({...prev, show: false}));
                        await updateActiveCollaData({
                            verdes: updatedVerdes,
                            absences: removedVerde
                                ? (collasData[activeColla].absences || []).filter(absence => absence.name !== removedVerde.name)
                                : collasData[activeColla].absences || []
                        });
                    }
                });
            };
            
            const handleSaveAbsence = async () => {
                const { name, type, start, shiftsRotation } = absenceForm;
                const startDate = parseLocalDate(start);
                const endDate = absenceForm.end ? parseLocalDate(absenceForm.end) : null;
                const knownNames = [...names, ...verdes.map(person => person.name)];
                if (!name || !startDate || !['BAJA', 'VACACIONES'].includes(type) || !knownNames.includes(name)) {
                    return showMessage('Datos no válidos', 'Selecciona una persona, un tipo de ausencia y una fecha de inicio válida.');
                }
                if (absenceForm.end && !endDate) return showMessage('Fecha no válida', 'La fecha final de la ausencia no es válida.');
                if (endDate && endDate < startDate) return showMessage('Rango no válido', 'La fecha final no puede ser anterior a la fecha de inicio.');
                const rangeEnd = absenceForm.end || '9999-12-31';
                const overlapsExisting = absences.some(absence =>
                    absence.name === name &&
                    start <= (absence.end || '9999-12-31') &&
                    rangeEnd >= absence.start
                );
                if (overlapsExisting) return showMessage('Ausencia duplicada', 'Esta persona ya tiene una ausencia registrada en parte o en todo ese periodo.');

                const newAbsence = { id: Date.now(), name, type, start, end: absenceForm.end || null, shiftsRotation };
                const newAbsences = [...absences, newAbsence].sort((a, b) => a.start.localeCompare(b.start));
                const saved = await updateActiveCollaData({ absences: newAbsences });
                if (!saved) return;
                setAbsenceForm({ name: '', type: 'BAJA', start: formatLocalDate(new Date()), end: '', shiftsRotation: true });
                showMessage('Guardado', 'Ausencia registrada correctamente.');
            };
            
            const handleEndAbsence = (id) => {
                const today = formatLocalDate(new Date());
                const absence = absences.find(item => item.id === id);
                if (!absence) return showMessage('Ausencia no encontrada', 'Actualiza la pantalla y vuelve a intentarlo.');
                if (today < absence.start) return showMessage('No se puede dar de alta', 'La ausencia empieza en una fecha futura.');
                const newAbsences = absences.map(a => { if (a.id === id) return { ...a, end: today }; return a; });
                updateActiveCollaData({ absences: newAbsences });
            };
            
            const handleDeleteAbsence = (id) => {

                    show: true, title: 'Borrar Ausencia', message: '¿Eliminar este registro de ausencia?', isAlert: false,
                    onConfirm: () => {
                        const newAbsences = absences.filter(a => a.id !== id); updateActiveCollaData({ absences: newAbsences });
                        setModalConfig(prev => ({...prev, show: false}));

                });

            const handleTransfer = () => {

                setModalConfig({
                    show: true, title: 'Traspaso', message: `¿Mover a ${transferName} a la otra colla?`, isAlert: false,
                    onConfirm: () => {
                        const sourceCollaId = transferSource; const targetCollaId = transferSource === '1' ? '2' : '1';
                        const sourceNames = [...collasData[sourceCollaId].names];
                        const targetNames = [...collasData[targetCollaId].names];

                        sourceNames.splice(idx, 1);

                        saveAllData(newCollasData, globalConfig).then(saved => {

            useEffect(() => { if (showSettings) { setTempConfig(globalConfig); setTempRefData(refData); setTransferSource(activeColla); } }, [showSettings, globalConfig, refData, activeColla]);
            const saveSettingsToCloud = async () => {
                const configErrors = validateConfig(tempConfig);
                if (configErrors.length) return showMessage('Configuración no válida', configErrors.join(' '));
                if (!tempRefData || !parseLocalDate(tempRefData.dateString)) {
