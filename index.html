            useEffect(() => { setSimulation(calculateSimulation(selectedDate, activeColla, collasData, globalConfig)); }, [selectedDate, globalConfig, collasData, activeColla]);

            const calculateMonthlyStats = () => {
                const year = selectedDate.getFullYear();
                const month = selectedDate.getMonth();
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const stats = {};
                [...names, ...verdes.map(v=>v.name)].forEach(n => stats[n] = { days: 0, guardia: 0, madruga: 0, baja: 0 });

                for(let i=1; i<=daysInMonth; i++) {
                    const d = new Date(year, month, i);
                    if(d.getDay() !== 0) { 
                        const sim = calculateSimulation(d, activeColla, collasData, globalConfig);
                        if(sim && sim.personStatus) {
                            Object.entries(sim.personStatus).forEach(([name, status]) => {
                                if(stats[name]) {
                                    if(status.status === 'WORK') {
                                        stats[name].days++;
                                        if(status.role && status.role.includes('GUARDIA')) stats[name].guardia++;
                                        if(status.role && status.role.includes('MADRUGA')) stats[name].madruga++;
                                    } else if(status.status === 'BAJA') {
                                        stats[name].baja++;
                                    }
                                }
                            });
                        }
                    }
                }
                setMonthlyStats(stats);
                setShowStats(true);
            };

            const isToday = (d) => { const today = new Date(); return d.getDate() === today.getDate() && d.getMonth() === today.getMonth() && d.getFullYear() === today.getFullYear(); };

            const weekData = useMemo(() => {
                if (!names || !names.length) return null; 
                const monday = getMonday(selectedDate);
                const days = [];
                for (let i = 0; i < 6; i++) {
                    const d = new Date(monday); d.setDate(monday.getDate() + i);
                    const sim = calculateSimulation(d, activeColla, collasData, globalConfig);
                    days.push({ date: d, shortName: d.toLocaleDateString('es-ES', { weekday: 'short' }).toUpperCase(), center: sim ? sim.center : '-', data: sim ? sim.personStatus : {} });
                }
                return days;
            }, [selectedDate, globalConfig, collasData, activeColla, names]); 

            const monthData = useMemo(() => {
                if (!names || !names.length) return null;
                const year = selectedDate.getFullYear();
                const month = selectedDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const daysInMonth = new Date(year, month + 1, 0).getDate();
                const leadingBlanks = (firstDay.getDay() + 6) % 7;
                const cells = Array.from({ length: leadingBlanks }, () => null);

                for (let day = 1; day <= daysInMonth; day++) {
                    const date = new Date(year, month, day);
                    const sim = calculateSimulation(date, activeColla, collasData, globalConfig);
                    const statuses = sim && sim.personStatus ? Object.values(sim.personStatus) : [];
                    cells.push({
                        date,
                        isToday: isToday(date),
                        isSunday: Boolean(sim && sim.isSunday),
                        center: sim && !sim.isSunday ? sim.center : '',
                        libra: sim && !sim.isSunday ? sim.libra : '',
                        guardias: statuses.filter(status => status.status === 'WORK' && status.role === 'GUARDIA').length,
                        madrugan: statuses.filter(status => status.status === 'WORK' && status.role === 'MADRUGA').length,
                        ausencias: statuses.filter(status => status.status === 'BAJA' || status.status === 'VACACIONES').length
                    });
                }

                while (cells.length % 7 !== 0) cells.push(null);
                return cells;
            }, [selectedDate, globalConfig, collasData, activeColla, names]);

            const handlePrev = () => {
                const d = new Date(selectedDate);
                if (viewMode === 'weekly') d.setDate(d.getDate() - 7);
                else if (viewMode === 'monthly') { d.setDate(1); d.setMonth(d.getMonth() - 1); }
                else d.setDate(d.getDate() - 1);
                setSelectedDate(d);
            };
            const handleNext = () => {
                const d = new Date(selectedDate);
                if (viewMode === 'weekly') d.setDate(d.getDate() + 7);
                else if (viewMode === 'monthly') { d.setDate(1); d.setMonth(d.getMonth() + 1); }
                else d.setDate(d.getDate() + 1);
                setSelectedDate(d);
            };
            const handleToday = () => setSelectedDate(new Date());
            
            const shareText = async (text) => { window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, '_blank'); };
            const handleShare = () => { 
                if (viewMode === 'daily') { 
                    if (!simulation) return; 
                    const dateStr = simulation.date.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); 
                    let text = `📅 *${dateStr.toUpperCase()}* - ${COLLA_NAMES[activeColla]}\n`; 
                    if (simulation.isSunday) text += `☕ *DOMINGO* - Descanso\n`; 
                    else { 
                        text += `📍 *Centro:* ${simulation.center}\n🌙 *Libra:* ${simulation.libra}\n--------------------------------\n`; 
                        simulation.groups.forEach(g => { 
                            text += `\n*${g.title}* (${g.items.length})\n`; 
                            g.items.forEach((item, idx) => { 
                                let badges = ""; 
                                if (item.status === 'BAJA') text += `🚑 ${item.name} (BAJA)\n`;
                                else if (item.status === 'VACACIONES') text += `🏖️ ${item.name} (VACACIONES)\n`;
                                else {
                                    if (item.special) badges += " 🟣"; if (item.isFlejador) badges += " 🛠️"; 
                                    let labelText = item.specialLabel ? ` [${item.specialLabel}]` : "";
                                    let displayTime = item.display ? item.display : item.time;
                                    text += `${idx + 1}. ${item.name} ${displayTime}${labelText}${badges}\n`; 
                                }
                            }); 
                        }); 
                    } 
                    text += `\nSimulador de Turnos`; shareText(text); 
                } else if (viewMode === 'weekly') {
                    if (!weekData) return; 
                    const weekStart = weekData[0].date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); 
                    const weekEnd = weekData[5].date.toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }); 
                    let text = `📅 *SEMANA ${weekStart} - ${weekEnd}* (${COLLA_NAMES[activeColla]})\n\n`; 
                    [...names, ...verdes.map(v => v.name)].forEach(name => { 
                        text += `👤 *${name}*\n`; 
                        let line1 = ""; let line2 = ""; 
                        for(let i=0; i<3; i++) { 
                            const d = weekData[i]; const info = d.data[name]; const dayName = d.shortName.substring(0,2); let val = "⚪"; 
                            if(info?.status === 'BAJA') val = "🚑"; else if(info?.status === 'VACACIONES') val = "🏖️"; else if(info?.status === 'WORK') { let displayTime = info.display || info.time.split(':')[0].replace(/^0/, ''); let centerCode = info.center === 'CEHORPA' ? 'CEH' : 'COR'; let emoji = "🔵"; if (info.role && info.role.includes('GUARDIA')) emoji = "🟢"; else if (info.role && info.role.includes('MADRUGA')) emoji = "🟠"; else if (info.role && info.role.includes('INTERMEDIO')) emoji = "🟡"; let extra = ""; if(info.isFlejador) extra = "F"; if(info.special) extra = "P"; if(extra) extra = `(${extra})`; val = `${emoji} ${centerCode} ${displayTime}${extra}`; } else { val = "⚪ LIBRE"; } line1 += `${dayName}: ${val}  `; 
                        } 
                        for(let i=3; i<6; i++) { 
                            const d = weekData[i]; const info = d.data[name]; const dayName = d.shortName.substring(0,2); let val = "⚪"; 
                            if(info?.status === 'BAJA') val = "🚑"; else if(info?.status === 'VACACIONES') val = "🏖️"; else if(info?.status === 'WORK') { let displayTime = info.display || info.time.split(':')[0].replace(/^0/, ''); let centerCode = info.center === 'CEHORPA' ? 'CEH' : 'COR'; let emoji = "🔵"; if (info.role && info.role.includes('GUARDIA')) emoji = "🟢"; else if (info.role && info.role.includes('MADRUGA')) emoji = "🟠"; else if (info.role && info.role.includes('INTERMEDIO')) emoji = "🟡"; let extra = ""; if(info.isFlejador) extra = "F"; if(info.special) extra = "P"; if(extra) extra = `(${extra})`; val = `${emoji} ${centerCode} ${displayTime}${extra}`; } else { val = "⚪ LIBRE"; } line2 += `${dayName}: ${val}  `; 
                        } 
                        text += `${line1}\n${line2}\n\n`; 
                    }); 
                    text += `Simulador de Turnos`; shareText(text); 
                } else {
                    if (!monthData) return;
                    const monthLabel = selectedDate.toLocaleDateString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();
                    let text = `📅 *${monthLabel}* (${COLLA_NAMES[activeColla]})\n\n`;
                    monthData.filter(Boolean).forEach(day => {
                        const label = day.date.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric' }).replace('.', '');
                        if (day.isSunday) text += `${label}: DOMINGO\n`;
                        else text += `${label}: ${day.center.substring(0, 3)} | Libra ${day.libra} | G${day.guardias} M${day.madrugan} A${day.ausencias}\n`;
                    });
                    text += `\nSimulador de Turnos`; shareText(text);
                } 
            };

            const performSearch = () => {
                if (['person', 'guardias', 'madrugadas', 'libres'].includes(searchType)) {
                    if (!searchPerson) return showMessage('Falta la persona', 'Selecciona a una persona antes de buscar.');
                    const results = [];
                    const iterDate = new Date(selectedDate);
                    const isEventSearch = searchType !== 'person';
                    const maxDays = isEventSearch ? 366 : searchRange;
                    for (let i = 0; i < maxDays; i++) {
                        const date = new Date(iterDate);
                        const sim = calculateSimulation(date, activeColla, collasData, globalConfig);
                        const personStatus = sim && !sim.isSunday ? sim.personStatus[searchPerson] : null;
                        if (!isEventSearch) {
                            let status = 'DESCONOCIDO';
                            if (!sim) status = 'NO DISPONIBLE';
                            else if (sim.isSunday) status = 'DOMINGO';
                            else if (!personStatus) status = 'NO ENCONTRADO';
                            else if (personStatus.status === 'LIBRE') status = 'LIBRA';
                            else if (['BAJA', 'VACACIONES'].includes(personStatus.status)) status = personStatus.status;
                            else if (personStatus.status === 'WORK') status = 'TRABAJA';
                            results.push({ date, status, details: personStatus });
                        } else if (personStatus) {
                            const isMatchingEvent = searchType === 'libres'
                                ? personStatus.status === 'LIBRE'
                                : personStatus.status === 'WORK' && personStatus.role === (searchType === 'guardias' ? 'GUARDIA' : 'MADRUGA');
                            if (isMatchingEvent) {
                                results.push({
                                    date,
                                    type: searchType === 'libres' ? 'LIBRE' : searchType === 'guardias' ? 'GUARDIA' : 'MADRUGA',
                                    center: personStatus.center || '',
                                    details: personStatus
                                });
                            }
                        }
                        iterDate.setDate(iterDate.getDate() + 1);
                        if (isEventSearch && results.length >= 10) break;
                    }
                    setSearchResults(results);
                } else {
                    const start = parseLocalDate(searchType === 'date' ? searchDateQuery : searchStartDate);
                    if (!start) return showMessage('Fecha no válida', 'Selecciona una fecha inicial válida.');
                    if (searchType === 'date') {
                        const sim1 = calculateSimulation(start, '1', collasData, globalConfig);
                        const sim2 = calculateSimulation(start, '2', collasData, globalConfig);
                        let result = { date: start, status: 'OK', libras: [] };
                        if ((sim1 && sim1.isSunday) || (sim2 && sim2.isSunday)) result.status = 'DOMINGO';
                        else if (sim1 && sim2) {
                            result.libras = [
                                { colla: 'RAYO', name: sim1.libra, status: sim1.libraStatus },
                                { colla: 'MIGUEL SEXI', name: sim2.libra, status: sim2.libraStatus }
                            ];
                        } else result.status = 'NO DISPONIBLE';
                        setSearchResults([result]);
                        return;
                    }

                    const end = parseLocalDate(searchEndDate);
                    if (!end || end < start) return showMessage('Rango no válido', 'La fecha final debe ser válida y no anterior a la fecha inicial.');
                    const totalDays = Math.round((Date.UTC(end.getFullYear(), end.getMonth(), end.getDate()) - Date.UTC(start.getFullYear(), start.getMonth(), start.getDate())) / 86400000) + 1;
                    if (totalDays > 366) return showMessage('Rango demasiado largo', 'El buscador admite rangos de hasta 366 días.');
                    const results = [];
                    const date = new Date(start);
                    for (let i = 0; i < totalDays; i++) {
                        const sims = ['1', '2'].map(collaId => calculateSimulation(new Date(date), collaId, collasData, globalConfig));
                        const isSunday = sims.some(sim => sim && sim.isSunday);
                        results.push({
                            date: new Date(date),
                            status: isSunday ? 'DOMINGO' : sims.every(Boolean) ? 'OK' : 'NO DISPONIBLE',
                            libres: isSunday ? [] : sims.flatMap((sim, index) => sim
                                ? [{ colla: COLLA_NAMES[index === 0 ? '1' : '2'], name: sim.libra }]
                                : [])
                        });
                        date.setDate(date.getDate() + 1);
                    }
                    setSearchResults(results);
                }
            };

            const handleExportSearchResults = () => {
                if (!searchResults || !searchResults.length) return showMessage('Sin resultados', 'Realiza una búsqueda antes de exportar.');
                const rows = [['Fecha', 'Colla', 'Persona', 'Resultado', 'Centro', 'Hora']];
                const addRow = (date, colla, person, result, center = '', time = '') => {
                    rows.push([
                        formatLocalDate(date),
                        colla,
                        person || '',
                        result || '',
                        center || '',
                        time || ''
                    ]);
                };
                if (searchType === 'person') {
                    searchResults.forEach(item => addRow(item.date, COLLA_NAMES[activeColla], searchPerson, item.status, item.details?.center, item.details?.time));
                } else if (['guardias', 'madrugadas', 'libres'].includes(searchType)) {
                    searchResults.forEach(item => addRow(item.date, COLLA_NAMES[activeColla], searchPerson, item.type, item.center, item.details?.time));
                } else if (searchType === 'date') {
                    searchResults.forEach(item => item.libras.forEach(libra => addRow(item.date, libra.colla, libra.name, 'LIBRA')));
                } else {
                    searchResults.forEach(item => {
                        if (item.status !== 'OK') addRow(item.date, '', '', item.status);
                        item.libres.forEach(libra => addRow(item.date, libra.colla, libra.name, 'LIBRA'));
                    });
                }
                const csv = `\uFEFF${rows.map(row => row.map(value => `"${String(value).replaceAll('"', '""')}"`).join(';')).join('\r\n')}`;
                const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
                const link = document.createElement('a');
                link.href = url;
                link.download = `busqueda-turnos-${formatLocalDate(new Date())}.csv`;
                document.body.appendChild(link);
                link.click();
                link.remove();
                window.setTimeout(() => URL.revokeObjectURL(url), 1000);
            };

            // RENDER
            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans text-xs flex flex-col">
                    <Header activeColla={activeColla} setActiveColla={setActiveColla} cloudStatus={cloudStatus} cloudError={cloudError} onCloudRetry={connectToSupabase} onSettingsClick={() => { setConfigTab('Personal'); setShowSettings(true); }} />
                    
                    <ControlBar 
                        selectedDate={selectedDate} setSelectedDate={setSelectedDate} 
                        viewMode={viewMode} setViewMode={setViewMode} 
                        onSearch={() => { setShowSearch(true); setSearchResults(null); }} 
                        onStats={calculateMonthlyStats} onShare={handleShare}
                        weekData={weekData}
                        handlePrev={handlePrev} handleNext={handleNext} handleToday={handleToday} isToday={isToday(selectedDate)}
                    />

                    {/* MODAL GLOBAL */}
                    <ConfirmationModal 
                        show={modalConfig.show} 
                        title={modalConfig.title} 
                        message={modalConfig.message} 
                        onConfirm={modalConfig.onConfirm} 
                        onCancel={() => setModalConfig(prev => ({ ...prev, show: false }))}
                        isAlert={modalConfig.isAlert}
                    />

                    {importPreview && (
                        <div className="fixed inset-0 z-[120] flex items-center justify-center bg-black/60 p-4">
                            <div className="max-h-[90vh] w-full max-w-lg overflow-y-auto rounded-xl bg-white p-5 shadow-2xl">
                                <h2 className="text-lg font-black text-slate-800">Revisar copia antes de importar</h2>
                                <p className="mt-1 break-all text-xs text-slate-500">{importPreview.name}</p>
                                <div className="mt-4 space-y-2">
                                    {importPreview.counts.map(item => (
                                        <div key={item.name} className="rounded-lg border bg-slate-50 p-3">
                                            <p className="text-sm font-black text-slate-700">{item.name}</p>
                                            <p className="mt-1 text-xs text-slate-600">{item.people} personas · {item.verdes} verdes · {item.absences} ausencias</p>
                                        </div>
                                    ))}
                                </div>
                                <p className="mt-3 rounded-lg bg-amber-50 p-3 text-xs font-semibold text-amber-900">
                                    Se creará y descargará una copia de seguridad del estado actual antes de reemplazarlo.
                                    {importPreview.adjustedIntermedios && ' Al importar se ajustará la configuración de intermedios de Cortijos para cuadrar la capacidad.'}
                                </p>
                                <div className="mt-5 flex gap-2">
                                    <button onClick={() => setImportPreview(null)} className="flex-1 rounded-lg bg-slate-100 py-3 text-xs font-bold text-slate-700">CANCELAR</button>
                                    <button onClick={confirmImportBackup} className="flex-1 rounded-lg bg-emerald-600 py-3 text-xs font-bold text-white">CREAR COPIA E IMPORTAR</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Modals & Overlays */}
                    {showStats && monthlyStats && (
                        <div className="fixed inset-0 z-50 bg-black/50 flex flex-col justify-center items-center p-4 animate-in fade-in duration-200">
                             <div className="bg-white rounded-xl shadow-2xl p-6 w-full max-w-md relative max-h-[80vh] flex flex-col">
                                <button onClick={() => setShowStats(false)} className="absolute top-3 right-3 text-gray-400 hover:text-gray-600"><Icon path={Icons.X} className="w-5 h-5" /></button>
                                <h2 className="text-xl font-bold text-gray-800 mb-1 flex items-center gap-2"><Icon path={Icons.Chart} className="w-6 h-6 text-indigo-500" /> Estadísticas Mensuales</h2>
                                <p className="text-xs text-gray-400 mb-4 uppercase font-bold tracking-widest">{selectedDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' })} - {COLLA_NAMES[activeColla]}</p>
                                <div className="overflow-y-auto flex-1 pr-2">
                                    <table className="w-full text-left text-xs">
                                        <thead className="bg-gray-50 sticky top-0"><tr><th className="p-2 border-b">Nombre</th><th className="p-2 border-b text-center">Días</th><th className="p-2 border-b text-center text-emerald-600">G</th><th className="p-2 border-b text-center text-orange-600">M</th><th className="p-2 border-b text-center text-red-600">B</th></tr></thead>
                                        <tbody className="divide-y divide-gray-100">{Object.entries(monthlyStats).sort((a,b) => b[1].days - a[1].days).map(([name, stat]) => (
                                            <tr key={name}><td className="p-2 font-bold text-slate-700 truncate max-w-[100px]">{name}</td><td className="p-2 text-center font-bold">{stat.days}</td><td className="p-2 text-center text-emerald-600 bg-emerald-50 rounded">{stat.guardia}</td><td className="p-2 text-center text-orange-600 bg-orange-50 rounded">{stat.madruga}</td><td className="p-2 text-center text-red-600">{stat.baja > 0 ? stat.baja : '-'}</td></tr>
                                        ))}</tbody>
                                    </table>
                                </div>
                             </div>
                        </div>
                    )}

                    {showSearch && ( <div className="fixed inset-0 z-50 bg-white flex flex-col p-4 animate-in fade-in duration-200"> 
                        <div className="flex justify-between mb-4"><h2 className="text-xl font-bold">Buscador</h2><button onClick={() => setShowSearch(false)}><Icon path={Icons.X} className="w-6 h-6" /></button></div> 
                        <div className="bg-white p-2 rounded-lg shadow-sm border border-gray-200 mb-3">
                            <div className="scrollbar-hide mb-3 flex gap-1 overflow-x-auto border-b pb-2">
                                {[
                                    ['person', 'Por persona'],
                                    ['guardias', 'Guardias'],
                                    ['madrugadas', 'Madrugadas'],
                                    ['libres', 'Días libres'],
                                    ['date', 'Quién libra'],
                                    ['range', 'Entre fechas']
                                ].map(([type, label]) => (
                                    <button key={type} onClick={() => { setSearchType(type); setSearchResults(null); }} className={`shrink-0 rounded-lg px-3 py-2 text-[10px] font-bold ${searchType === type ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-500'}`}>{label}</button>
                                ))}
                            </div>
                            {['person', 'guardias', 'madrugadas', 'libres'].includes(searchType) ? (
                                <div className="flex gap-2 mb-2">
                                    <select className="flex-1 p-2 border rounded text-sm font-bold bg-gray-50" value={searchPerson} onChange={(e) => setSearchPerson(e.target.value)}><option value="">Selecciona Persona...</option>{names.map(n => <option key={n} value={n}>{n}</option>)}{verdes.map(v => <option key={v.name} value={v.name}>{v.name} (Verde)</option>)}</select>
                                    {searchType === 'person' && <div className="flex rounded border overflow-hidden shrink-0"><button onClick={() => setSearchRange(7)} className={`px-3 py-2 text-xs font-bold ${searchRange === 7 ? 'bg-emerald-100 text-emerald-800' : 'bg-white'}`}>7D</button><button onClick={() => setSearchRange(30)} className={`px-3 py-2 text-xs font-bold ${searchRange === 30 ? 'bg-emerald-100 text-emerald-800' : 'bg-white'}`}>30D</button></div>}
                                </div>
                            ) : searchType === 'date' ? (
                                <div className="mb-2"><label className="mb-1 block text-[10px] font-bold text-slate-500">Fecha</label><input type="date" className="w-full p-3 border rounded text-lg font-bold text-center" value={searchDateQuery} onChange={e => setSearchDateQuery(e.target.value)} /></div>
                            ) : (
                                <div className="mb-2 grid grid-cols-2 gap-2">
                                    <label className="text-[10px] font-bold text-slate-500">Desde<input type="date" className="mt-1 w-full rounded border p-2 text-sm" value={searchStartDate} onChange={e => setSearchStartDate(e.target.value)} /></label>
                                    <label className="text-[10px] font-bold text-slate-500">Hasta<input type="date" className="mt-1 w-full rounded border p-2 text-sm" value={searchEndDate} onChange={e => setSearchEndDate(e.target.value)} /></label>
                                </div>
                            )}
                            <button onClick={performSearch} disabled={['person', 'guardias', 'madrugadas', 'libres'].includes(searchType) && !searchPerson} className="w-full bg-emerald-600 text-white py-2 rounded font-bold text-sm">VER RESULTADO</button>
                        </div>
                        {searchResults && (<div className="pb-10 animate-in slide-in-from-bottom-2 fade-in duration-300 flex-1 overflow-y-auto">
                            <button onClick={handleExportSearchResults} className="mb-3 w-full rounded-lg border border-slate-300 bg-white py-2 text-xs font-bold text-slate-700 shadow-sm hover:bg-slate-50">EXPORTAR RESULTADO A CSV</button>
                            {searchType === 'person' ? (
                                <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                                    {searchResults.map((res, idx) => (
                                        <div key={idx} className={`rounded-lg border-2 shadow-sm p-1.5 flex flex-col justify-between min-h-[95px] relative overflow-hidden ${res.status === 'DOMINGO' ? 'bg-slate-300 border-slate-500' : res.status === 'LIBRA' ? 'bg-gray-300 border-gray-500' : res.status === 'BAJA' ? 'bg-red-300 border-red-500' : res.status === 'VACACIONES' ? 'bg-green-300 border-green-500' : (res.details?.role||'').includes('GUARDIA') ? 'bg-emerald-300 border-emerald-500' : (res.details?.role||'').includes('MADRUGA') ? 'bg-orange-300 border-orange-500' : 'bg-blue-300 border-blue-500'}`}>
                                            <div className="flex justify-between items-start mb-1">
                                                <div className="text-center leading-tight bg-white/50 rounded px-1 min-w-[30px]"><div className="text-[9px] font-bold text-black uppercase">{res.date.toLocaleDateString('es-ES', { weekday: 'short' })}</div><div className="text-sm font-black text-black">{res.date.getDate()}</div></div>
                                                {res.status === 'TRABAJA' && <span className="text-[10px] font-black px-1.5 py-0.5 rounded bg-black/80 text-white uppercase tracking-tighter shadow-sm">{res.details.center.substring(0,3)}</span>}
                                            </div>
                                            <div className="flex-1 flex flex-col justify-center items-center">
                                                {res.status === 'DOMINGO' && <div className="text-slate-500 flex flex-col items-center"><Icon path={Icons.Coffee} className="w-6 h-6 mb-0.5 text-slate-600" /><span className="text-[10px] font-black">DOMINGO</span></div>}
                                                {res.status === 'LIBRA' && <div className="text-red-700 flex flex-col items-center"><Icon path={Icons.Moon} className="w-6 h-6 mb-0.5 text-red-600" /><span className="text-[11px] font-black">LIBRA</span></div>}
                                                {res.status === 'TRABAJA' && <div className="text-center w-full bg-white/40 rounded py-1"><div className="text-2xl font-black text-black leading-none mb-0.5 tracking-tight">{res.details.time}</div><div className="text-[10px] font-bold text-black uppercase flex items-center justify-center gap-1">{res.details.role}</div></div>}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : ['guardias', 'madrugadas', 'libres'].includes(searchType) ? (
                                <div className="space-y-2">
                                    <h3 className="text-center font-bold text-slate-500 text-xs mb-2 uppercase tracking-widest">Próximos {searchType === 'guardias' ? 'servicios de guardia' : searchType === 'madrugadas' ? 'servicios de madrugada' : 'días libres'} de {searchPerson}</h3>
                                    {searchResults.map((res, idx) => (
                                        <div key={idx} className={`flex items-center p-3 rounded-lg shadow-sm border-l-4 ${res.type === 'LIBRE' ? 'bg-red-50 border-red-500' : res.type === 'MADRUGA' ? 'bg-orange-50 border-orange-500' : 'bg-emerald-50 border-emerald-500'}`}>
                                            <div className="bg-white/80 rounded px-2 py-1 text-center mr-3 min-w-[50px] shadow-sm">
                                                <div className="text-[10px] font-bold text-slate-500 uppercase">{res.date.toLocaleDateString('es-ES', { weekday: 'short' })}</div>
                                                <div className="text-xl font-black text-slate-800 leading-none">{res.date.getDate()}</div>
                                                <div className="text-[9px] font-bold text-slate-400">{res.date.toLocaleDateString('es-ES', { month: 'short' })}</div>
                                            </div>
                                            <div className="flex-1">
                                                <div className={`text-sm font-black ${res.type === 'LIBRE' ? 'text-red-600' : res.type === 'MADRUGA' ? 'text-orange-700' : 'text-emerald-700'}`}>
                                                    {res.type === 'LIBRE' ? 'LIBRA' : res.type === 'MADRUGA' ? 'MADRUGA' : 'GUARDIA'}
                                                </div>
                                                {res.type !== 'LIBRE' && (
                                                    <div className="text-xs font-bold text-slate-600 bg-white/50 inline-block px-1.5 rounded mt-0.5 border border-emerald-100">
                                                        {res.center ? `en ${res.center}` : ''}{res.details?.time ? ` · ${res.details.time}` : ''}
                                                    </div>
                                                )}
                                            </div>

                                </div>
                            </div>
                            <div className={`${configTab !== 'Turnos' ? 'hidden ' : ''}bg-gradient-to-r from-slate-100 to-white rounded-xl shadow-sm border border-slate-300 p-6`}><h3 className="text-xl font-bold text-slate-900 mb-4 border-b pb-2 flex items-center gap-2"><Icon path={Icons.Rotate} className="w-6 h-6 text-blue-600" /> PUNTO DE PARTIDA ({COLLA_NAMES[activeColla]})</h3><div className="grid grid-cols-1 md:grid-cols-3 gap-6"><div><label className="block text-sm font-bold text-gray-700 mb-1">Fecha de Inicio</label><input type="date" className="w-full p-3 border rounded-lg text-lg font-mono" value={tempRefData.dateString} onChange={(e) => setTempRefData({...tempRefData, dateString: e.target.value})} /></div><div><label className="block text-sm font-bold text-gray-700 mb-1">Primer Guardia (Nº 1)</label><select className="w-full p-3 border rounded-lg text-lg font-bold text-slate-700" value={tempRefData.firstGuardName} onChange={(e) => setTempRefData({...tempRefData, firstGuardName: e.target.value})}>{names.map(name => <option key={name} value={name}>{name}</option>)}</select></div><div><label className="block text-sm font-bold text-gray-700 mb-1">Centro ese día</label><div className="flex gap-0 rounded-lg overflow-hidden border border-gray-300 h-[50px]"><button onClick={() => setTempRefData({...tempRefData, center: 'CORTIJOS'})} className={`flex-1 font-bold transition ${tempRefData.center === 'CORTIJOS' ? 'bg-emerald-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>CORTIJOS</button><button onClick={() => setTempRefData({...tempRefData, center: 'CEHORPA'})} className={`flex-1 font-bold transition ${tempRefData.center === 'CEHORPA' ? 'bg-blue-600 text-white' : 'bg-gray-50 text-gray-500 hover:bg-gray-100'}`}>CEHORPA</button></div></div></div></div>
                            <div className={`${configTab !== 'Verdes' ? 'hidden ' : ''}bg-green-50 rounded-xl shadow-sm border border-green-200 p-6`}>
                                <h3 className="text-xl font-bold text-green-800 mb-6 border-b border-green-200 pb-2 flex items-center gap-2"><Icon path={Icons.Leaf} className="w-6 h-6" /> LOS VERDES (Personal Especial)</h3>
                                <div className="bg-white p-4 rounded-lg border border-green-100 mb-4">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div><label className="text-xs font-bold text-gray-500">Nombre</label><input type="text" className="w-full p-2 border rounded uppercase font-bold" value={newVerde.name} onChange={e => setNewVerde({...newVerde, name: e.target.value})} /></div>
                                        <div><label className="text-xs font-bold text-gray-500">Fecha de inicio del periodo</label><input type="date" className="w-full p-2 border rounded" value={newVerde.startDate} onChange={e => setNewVerde({...newVerde, startDate: e.target.value})} /></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                                        <div><label className="text-xs font-bold text-gray-500">Patrón Inicial (Esa semana hace...)</label><select className="w-full p-2 border rounded" value={newVerde.startCycleIndex} onChange={e => setNewVerde({...newVerde, startCycleIndex: parseInt(e.target.value)})}><option value="0">Guardia L-J (Madruga X-S)</option><option value="1">Guardia M-V (Madruga L-J)</option><option value="2">Guardia X-S (Madruga M-V)</option></select></div>
                                        <div><label className="text-xs font-bold text-gray-500">Centro inicial</label><select className="w-full p-2 border rounded" value={newVerde.startCenter} onChange={e => setNewVerde({...newVerde, startCenter: e.target.value})}><option value="CORTIJOS">Empieza en CORTIJOS</option><option value="CEHORPA">Empieza en CEHORPA</option></select></div>
                                    </div>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 items-end">
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Cambio de centro</label>
                                            <select className="w-full p-2 border rounded" value={newVerde.rotationMode} onChange={e => setNewVerde({...newVerde, rotationMode: e.target.value})}>
                                                <option value="SEMANAL">Cada semana</option>
                                                <option value="DIARIO">Cada día</option>
                                                <option value="FIJO">No cambia de centro</option>
                                                <option value="SEGUN_GRUPO">Sigue al centro del grupo</option>
                                            </select>
                                        </div>
                                        <div>
                                            <label className="text-xs font-bold text-gray-500">Duración</label>
                                            <div className="grid grid-cols-3 gap-1">
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'WEEK'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'WEEK' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>7 días</button>
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'CUSTOM'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'CUSTOM' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Fechas</button>
                                                <button type="button" onClick={() => setNewVerde({...newVerde, periodMode: 'ONGOING'})} className={`rounded border px-2 py-2 text-xs font-bold ${newVerde.periodMode === 'ONGOING' ? 'border-green-600 bg-green-600 text-white' : 'bg-white text-gray-600'}`}>Sin fin</button>
                                            </div>
                                        </div>
                                    </div>
                                    {newVerde.periodMode === 'CUSTOM' && <div><label className="text-xs font-bold text-gray-500">Fecha de fin (incluida)</label><input type="date" min={newVerde.startDate} className="w-full p-2 border rounded" value={newVerde.endDate} onChange={e => setNewVerde({...newVerde, endDate: e.target.value})} /></div>}
                                    {newVerde.periodMode === 'WEEK' && <p className="text-xs text-green-800">Estará activo desde el inicio durante 7 días, ambos extremos incluidos.</p>}
                                    {newVerde.periodMode === 'ONGOING' && <p className="text-xs text-green-800">Estará activo desde la fecha de inicio hasta que lo elimines.</p>}
                                    <button onClick={addVerde} className="mt-4 w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 shadow-sm">AÑADIR VERDE AL PERIODO</button>
                                </div>
                                <div className="space-y-2">
                                    {verdes.map(v => (
                                        <div key={v.id} className="flex justify-between items-center bg-white p-3 rounded border shadow-sm">
                                            <div>
                                                <span className="font-black text-green-900">{v.name}</span>
                                                <div className="text-[10px] text-gray-500 font-mono mt-0.5">
                                                    {v.startDate} – {v.endDate || 'sin fecha de fin'} | {v.rotationMode === 'FIJO' ? 'Centro fijo' : v.rotationMode === 'DIARIO' ? 'Cambia de centro cada día' : v.rotationMode === 'SEGUN_GRUPO' ? 'Sigue al grupo' : 'Cambia de centro cada semana'} | Inicio en {v.startCenter || v.centerMode || 'CEHORPA'}
                                                </div>
                                            </div>
                                            <button onClick={() => removeVerde(v.id)} className="text-red-500 hover:bg-red-50 p-1 rounded"><Icon path={Icons.Trash} className="w-4 h-4" /></button>
                                        </div>
                                    ))}
                                    {verdes.length === 0 && <p className="text-center text-gray-400 italic text-xs">No hay personal verde configurado.</p>}
                                </div>
                            </div>
                        </div> 
                        </div>
                        <div className="-mx-3 shrink-0 border-t bg-white px-3 pt-2 sm:-mx-6 sm:px-6">
                            <button onClick={saveSettingsToCloud} className="w-full rounded-xl bg-green-600 py-3 font-bold text-white shadow-lg">GUARDAR CAMBIOS</button>
                        </div>
                    </div> )}

                    <main className="max-w-lg mx-auto p-1.5 flex-1 flex flex-col w-full">
                        {names.length === 0
                            ? <p className="m-4 rounded-lg border border-amber-200 bg-amber-50 p-4 text-center text-sm font-semibold text-amber-800">Esta colla no tiene personal configurado. Añade personas desde Configuración.</p>
                            : viewMode === 'daily'
                            ? <DailyView simulation={simulation} />
                            : viewMode === 'monthly'
                            ? <MonthlyView monthData={monthData} selectedDate={selectedDate} onSelectDate={(date) => { setSelectedDate(date); setViewMode('daily'); }} />
                            : <WeeklyView weekData={weekData} names={names} verdes={verdes} />
                        }
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
